<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MoneySplit Feedback Admin</title><style>body{font-family:system-ui,sans-serif;margin:0;padding:20px;background:#f3f5f8;color:#172033}main{max-width:900px;margin:auto;background:#fff;padding:22px;border-radius:16px}input,button{padding:10px;border-radius:9px;border:1px solid #ccd3dc;font:inherit}input{width:min(100%,420px)}button{background:#2563eb;color:#fff;border:0;cursor:pointer}.card{padding:14px;border:1px solid #ddd;border-radius:10px;margin:10px 0}.meta{font-size:12px;color:#687386}.message{white-space:pre-wrap;margin-top:8px}</style></head><body><main><h1>MoneySplit Feedback</h1><p>Private admin view.</p><input id="secret" type="password" placeholder="Feedback admin secret"> <button id="load">Load Feedback</button><p id="status"></p><div id="list"></div></main><script>const s=document.getElementById('secret'),b=document.getElementById('load'),st=document.getElementById('status'),l=document.getElementById('list');b.onclick=async()=>{st.textContent='Loading...';try{const r=await fetch('/api/feedback?limit=200',{headers:{'X-Admin-Secret':s.value}}),d=await r.json();if(!r.ok)throw Error(d.error||'Request failed');l.innerHTML=(d.feedback||[]).map(x=>'<article class="card"><div class="meta">'+x.created_at+' · '+x.type+' · Rating: '+(x.rating||'—')+' · '+(x.email||'No email')+'</div><div class="message">'+String(x.message).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))+'</div></article>').join('');st.textContent=(d.feedback||[]).length+' feedback item(s).'}catch(e){st.textContent=e.message}};</script></body></html>
